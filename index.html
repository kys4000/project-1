<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1020">
  <title>지하철 역이름 퀴즈</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-lines" aria-hidden="true">
    <svg viewBox="0 0 1200 800" preserveAspectRatio="xMidYMid slice">
      <path d="M-50 120 H420 Q470 120 500 160 L640 340 Q670 380 720 380 H1250" stroke="#00A84D"/>
      <path d="M-50 260 H260 Q310 260 340 230 L520 60 Q550 30 600 30 H1250" stroke="#EF7C1C"/>
      <path d="M180 -50 V300 Q180 350 220 380 L420 540 Q460 570 460 620 V850" stroke="#00A5DE"/>
      <path d="M-50 470 H560 Q610 470 640 440 L820 260 Q850 230 900 230 H1250" stroke="#996CAC"/>
      <path d="M900 -50 V180 Q900 230 860 260 L700 400 Q660 430 660 480 V850" stroke="#E6186C"/>
      <path d="M-50 640 H300 Q350 640 380 610 L520 480 Q550 450 600 450 H760 Q810 450 840 480 L1000 640 Q1030 670 1080 670 H1250" stroke="#BDB092"/>
      <path d="M1050 -50 V420 Q1050 470 1010 500 L860 610 Q820 640 820 690 V850" stroke="#747F00"/>
    </svg>
  </div>

  <main class="app">
    <!-- 홈 -->
    <section id="home" class="screen">
      <header class="hero">
        <div class="hero-badges" aria-hidden="true">
          <span style="--c:#0052A4">1</span><span style="--c:#00A84D">2</span><span style="--c:#EF7C1C">3</span><span style="--c:#00A5DE">4</span><span style="--c:#996CAC">5</span><span style="--c:#CD7C2F">6</span><span style="--c:#747F00">7</span><span style="--c:#E6186C">8</span><span style="--c:#BDB092">9</span>
        </div>
        <h1>서울 지하철<br><em>역이름 퀴즈</em></h1>
        <p class="lead">앞뒤 역을 보고 빈칸을 채우거나,<br>한 노선을 통째로 정복해 보세요.</p>
      </header>

      <div class="card mode">
        <div class="mode-head">
          <div class="mode-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M3 12h5m8 0h5" /><circle cx="12" cy="12" r="3.2"/></svg>
          </div>
          <div>
            <h2>빈칸 퀴즈</h2>
            <p class="muted">이전 역과 다음 역 사이, 이 역의 이름은? · 10문제</p>
          </div>
        </div>
        <div class="label">출제 노선</div>
        <div id="quiz-lines" class="line-picker"></div>
        <div class="label">답하는 방식</div>
        <div class="seg" role="radiogroup">
          <button class="seg-btn active" data-answer="choice">보기 4개</button>
          <button class="seg-btn" data-answer="type">직접 입력</button>
        </div>
        <button id="start-quiz" class="btn primary big">출발하기 <span aria-hidden="true">→</span></button>
        <p class="best" id="best-quiz"></p>
      </div>

      <div class="card mode">
        <div class="mode-head">
          <div class="mode-icon alt" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
          </div>
          <div>
            <h2>노선 정복</h2>
            <p class="muted">제한 시간 안에 한 노선의 역 이름을 모두 입력하세요.</p>
          </div>
        </div>
        <div id="conquer-lines" class="line-grid"></div>
      </div>

      <footer class="foot">역 데이터는 1~9호선 주요 구간 기준입니다.</footer>
    </section>

    <!-- 빈칸 퀴즈 -->
    <section id="quiz" class="screen hidden">
      <div class="topbar">
        <button class="btn ghost small" data-home>← 홈</button>
        <div class="dots" id="q-dots"></div>
        <div class="pill">점수 <b id="q-score">0</b></div>
      </div>

      <div class="card question">
        <div class="q-head">
          <div class="line-badge" id="q-badge">2</div>
          <p class="q-title"><span id="q-round">1</span>번째 역 · 빈칸에 들어갈 역은?</p>
        </div>
        <div class="sign" id="q-track"></div>
        <div id="q-choices" class="choices"></div>
        <form id="q-form" class="type-form hidden" autocomplete="off">
          <input id="q-input" type="text" placeholder="역 이름 입력" enterkeyhint="done">
          <button class="btn primary" type="submit">확인</button>
        </form>
        <div class="q-tools">
          <button id="q-hint" class="btn ghost small">💡 초성 힌트 <span class="muted">-5점</span></button>
          <span id="q-hint-text" class="hint"></span>
        </div>
        <div id="q-feedback" class="feedback"></div>
        <button id="q-next" class="btn primary big hidden">다음 역 →</button>
      </div>
    </section>

    <!-- 노선 정복 -->
    <section id="conquer" class="screen hidden">
      <div class="topbar">
        <button class="btn ghost small" data-home>← 홈</button>
        <div class="pill"><b id="c-found">0</b> / <span id="c-total">0</span></div>
        <div class="pill timer" id="c-timer">0:00</div>
      </div>
      <div class="card">
        <div class="conquer-head">
          <div class="line-badge" id="c-badge">2</div>
          <form id="c-form" class="type-form" autocomplete="off">
            <input id="c-input" type="text" placeholder="역 이름 입력 후 Enter" enterkeyhint="done">
          </form>
          <button id="c-giveup" class="btn ghost small">포기</button>
        </div>
        <div class="progress"><div id="c-bar"></div></div>
        <div id="c-msg" class="feedback"></div>
        <div id="c-board" class="board"></div>
      </div>
    </section>

    <!-- 결과 -->
    <section id="result" class="screen hidden">
      <div class="card result">
        <div class="ticket">
          <div class="ticket-top">
            <span class="ticket-label">SCORE</span>
            <h2 id="r-title">결과</h2>
          </div>
          <div class="big" id="r-score">0</div>
          <p id="r-detail" class="muted"></p>
        </div>
        <div id="r-review" class="review"></div>
        <div class="row">
          <button id="r-again" class="btn primary big">다시 하기</button>
          <button class="btn ghost big" data-home>홈으로</button>
        </div>
      </div>
    </section>
  </main>

  <div id="fx" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
