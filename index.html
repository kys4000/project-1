<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>지하철 역이름 퀴즈</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <!-- 홈 -->
    <section id="home" class="screen">
      <header class="hero">
        <div class="hero-track" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
        <h1>서울 지하철<br>역이름 퀴즈</h1>
        <p class="muted">앞뒤 역을 보고 빈칸을 채우거나, 한 노선을 통째로 정복해 보세요.</p>
      </header>

      <div class="card">
        <h2>빈칸 퀴즈</h2>
        <p class="muted">이전 역과 다음 역 사이, 가운데 역은? 10문제.</p>
        <div class="label">출제 노선</div>
        <div id="quiz-lines" class="line-picker"></div>
        <div class="label">답하는 방식</div>
        <div class="seg" role="radiogroup">
          <button class="seg-btn active" data-answer="choice">보기 4개</button>
          <button class="seg-btn" data-answer="type">직접 입력</button>
        </div>
        <button id="start-quiz" class="btn primary">시작하기</button>
        <p class="best" id="best-quiz"></p>
      </div>

      <div class="card">
        <h2>노선 정복</h2>
        <p class="muted">노선을 고르고 제한 시간 안에 역 이름을 모두 입력하세요.</p>
        <div id="conquer-lines" class="line-grid"></div>
      </div>
    </section>

    <!-- 빈칸 퀴즈 -->
    <section id="quiz" class="screen hidden">
      <div class="topbar">
        <button class="btn ghost small" data-home>← 홈</button>
        <div class="stat"><span id="q-round">1</span>/10</div>
        <div class="stat">점수 <b id="q-score">0</b></div>
      </div>

      <div class="card question">
        <div class="line-badge" id="q-badge">2</div>
        <p class="q-title">빈칸에 들어갈 역은?</p>
        <div class="track" id="q-track"></div>
        <div id="q-choices" class="choices"></div>
        <form id="q-form" class="type-form hidden" autocomplete="off">
          <input id="q-input" type="text" placeholder="역 이름 입력" enterkeyhint="done">
          <button class="btn primary" type="submit">확인</button>
        </form>
        <div class="q-tools">
          <button id="q-hint" class="btn ghost small">초성 힌트 (-5점)</button>
          <span id="q-hint-text" class="hint"></span>
        </div>
        <div id="q-feedback" class="feedback"></div>
        <button id="q-next" class="btn primary hidden">다음 문제 →</button>
      </div>
    </section>

    <!-- 노선 정복 -->
    <section id="conquer" class="screen hidden">
      <div class="topbar">
        <button class="btn ghost small" data-home>← 홈</button>
        <div class="stat"><span id="c-found">0</span>/<span id="c-total">0</span></div>
        <div class="stat timer" id="c-timer">0:00</div>
      </div>
      <div class="card">
        <div class="conquer-head">
          <div class="line-badge" id="c-badge">2</div>
          <form id="c-form" class="type-form" autocomplete="off">
            <input id="c-input" type="text" placeholder="역 이름을 입력하세요" enterkeyhint="done">
          </form>
          <button id="c-giveup" class="btn ghost small">포기</button>
        </div>
        <div id="c-msg" class="feedback"></div>
        <div class="progress"><div id="c-bar"></div></div>
        <div id="c-board" class="board"></div>
      </div>
    </section>

    <!-- 결과 -->
    <section id="result" class="screen hidden">
      <div class="card result">
        <h2 id="r-title">결과</h2>
        <div class="big" id="r-score">0</div>
        <p id="r-detail" class="muted"></p>
        <div id="r-review" class="review"></div>
        <div class="row">
          <button id="r-again" class="btn primary">다시 하기</button>
          <button class="btn ghost" data-home>홈으로</button>
        </div>
      </div>
    </section>
  </main>

  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
